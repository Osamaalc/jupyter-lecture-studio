name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: mypy

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  core-without-extras:
    name: Core works without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install .
      - name: Render and export without IPython or Pygments
        run: |
          python - <<'EOF'
          from jupyter_lecture_studio import LectureDeck
          deck = LectureDeck(course="CI", locale="en")
          deck.cover("Cover", show=False)
          deck.slide("Slide", cards=[{"title": "SQL", "code": "SELECT 1;", "language": "sql"}], show=False)
          deck.quiz("Q?", ["a", "b"], 0, show=False)
          print(deck.export("ci.html"), deck.export("ci-slides.html", present=True))
          EOF
      - run: jupyter-lecture-studio info

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -E -a -b html -W --keep-going docs build/docs-check

  package:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build -e ".[docs]"
      - run: python tools/build_docs.py
      - run: python -m build --outdir dist
      - run: python tools/verify_release.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
