name: Release

# Publish to PyPI when a version tag such as v1.0.0 is pushed.
# Configure "trusted publishing" for this repository on PyPI first; no token is stored here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build -e ".[dev,docs]"
      - run: pytest
      - run: python tools/build_docs.py
      - run: python -m build --outdir dist
      - run: python tools/verify_release.py dist
      - name: Tag matches the package version
        run: test "v$(python -c 'import lecture_studio; print(lecture_studio.__version__)')" = "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
